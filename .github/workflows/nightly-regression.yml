name: Nightly regression

# Tier 2: runs once a night and can also be started by hand from the Actions tab.
# The cron time is UTC.
on:
  schedule:
    - cron: '0 20 * * *'
  workflow_dispatch:

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
      - name: Install dependencies
        run: npm ci
      - name: Install all browsers
        run: npx playwright install --with-deps
      - name: Run the full regression set on three browsers
        run: npx playwright test --grep @regression
